name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The consent gate only fails the build from assert-grid.js, and `npm run
      # build` merely warns and withholds. Without this step a published image
      # that lost its consentRef would deploy green and silent.
      - name: Grid law and child-image consent gate
        run: npm test
      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /littlecaterpillars
          # LC_ALLOW_PENDING_CONSENT is deliberately NOT set here. It bypasses the
          # child-image consent gate and README.md § Photography says never to set
          # it in CI or on a deploy. With every published entry carrying a
          # consentRef the build is unaffected; if one ever loses its reference,
          # the gate must be the thing that stops the deploy.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4